<!-- @format -->

<!doctype html>
<html>
  <head>
    <style>
      body {
        width: 220px;
        padding: 15px;
        font-family: sans-serif;
        background: #f4f7f6;
      }
      h3 {
        font-size: 14px;
        color: #333;
        margin-top: 0;
      }
      label {
        font-size: 11px;
        color: #666;
        display: block;
        margin-bottom: 5px;
      }
      input {
        width: 100%;
        margin-bottom: 15px;
        padding: 5px;
        box-sizing: border-box;
      }
      button {
        width: 100%;
        background: #28a745;
        color: white;
        border: none;
        padding: 8px;
        cursor: pointer;
        border-radius: 4px;
        font-weight: bold;
      }
      button:hover {
        background: #218838;
      }
    </style>
  </head>
  <body>
    <h3>Format Settings</h3>

    <label>Highlight Color:</label>
    <input type="color" id="userColor" value="#e1f5fe" />

    <label>Default Decimals:</label>
    <input type="number" id="userDecimals" value="2" min="0" max="5" />

    <!-- FIXED: This ID must exist for popup.js to work -->
    <button id="saveBtn">Save Settings</button>

    <script src="popup.js"></script>
  </body>
</html>
